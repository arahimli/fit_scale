name: fit_scale
description: >-
  Clamped responsive sizing for Flutter. Layouts that do not overflow, shrink
  touch targets or distort shapes on small, large or rotated screens, plus a
  test harness that checks every screen across devices and text sizes.
version: 0.6.0
repository: https://github.com/arahimli/fit_scale
issue_tracker: https://github.com/arahimli/fit_scale/issues
screenshots:
  - description: >-
      flutter_screenutil and fit_scale side by side on an iPhone SE with
      larger system text.
    path: doc/screenshots/iphone_se1_320x568_x1.3.png
  - description: Side by side on an iPhone 16 Pro with system text ×2.0.
    path: doc/screenshots/iphone16pro_402x874_x2.0.png
  - description: Side by side on a phone in landscape.
    path: doc/screenshots/phone_landscape_874x402_x1.0.png
  - description: Avatar initials with Text and with FitText at system text ×2.0.
    path: doc/screenshots/fit_text_avatar_x2.0.png
  - description: One stretched column vs two columns with FitLayout in landscape.
    path: doc/screenshots/fit_layout_landscape.png
  - description: FitDebugOverlay on the flutter_screenutil and fit_scale screens.
    path: doc/screenshots/fit_debug_overlay.png
  - description: HTML report of a screen across 11 devices and 3 text sizes.
    path: doc/screenshots/fit_report.jpg
topics:
  - responsive
  - layout
  - accessibility
  - testing
  - screen-size

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Only used by package:fit_scale/testing.dart.
  flutter_test:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_lints: ^5.0.0
