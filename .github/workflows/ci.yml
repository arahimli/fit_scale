name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version allowed by pubspec.yaml, and the latest stable
        # (an empty version means latest on the channel).
        include:
          - flutter: '3.24.5'
            version: '3.24.5'
          - flutter: stable
            version: ''
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      # lib/ only uses package:flutter/widgets.dart and must stay clean.
      # Tests and the example use material.dart, which Flutter 3.47+
      # deprecates in favour of material_ui (not available on 3.24), so
      # infos there do not fail the build.
      - name: Analyze
        run: |
          flutter analyze lib
          flutter analyze --no-fatal-infos

      # Tests that pass reportDir to testFitScale write an HTML report
      # (and add a table to this job's summary); keep it, also on failure.
      - run: flutter test

      - name: Upload fit_scale report
        if: always() && matrix.flutter == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: fit_scale-report
          path: build/fit_scale_report
          if-no-files-found: ignore

      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Publish dry run
        if: matrix.flutter == 'stable'
        run: flutter pub publish --dry-run
